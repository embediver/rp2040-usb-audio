[workspace]
members = ["proc-lut"]

[package]
edition = "2024"
name = "rp2040-soundcard"
version = "0.1.0"
authors = ["Marvin Gudel <github.marvin@gudel.org>"]
resolver = "2"

[[bin]]
name = "rp2040-soundcard"
test = false
bench = false

[dependencies]
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-storage = "0.3.1"

cortex-m-rt = "0.7.3"
cortex-m = { version = "0.7.6" }

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.6" }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.4", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-usb = "0.4.0"
static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }

proc-lut = { path = "proc-lut" }
byteorder = { version = "1.5", default-features = false }

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", commit = "f9f20ae2174cb26d0f8926207d179041cfec2d2e" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", commit = "f9f20ae2174cb26d0f8926207d179041cfec2d2e" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", commit = "f9f20ae2174cb26d0f8926207d179041cfec2d2e" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", commit = "f9f20ae2174cb26d0f8926207d179041cfec2d2e" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", commit = "f9f20ae2174cb26d0f8926207d179041cfec2d2e" }


[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
