[workspace]
members = ["proc-lut"]

[package]
edition = "2024"
name = "rp2040-soundcard"
version = "0.1.0"
authors = ["Marvin Gudel <github.marvin@gudel.org>"]
resolver = "2"

[[bin]]
name = "rp2040-soundcard"
test = false
bench = false

[dependencies]
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"], optional = true }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-storage = "0.3.1"

cortex-m-rt = "0.7.3"
cortex-m = { version = "0.7.6" }

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.6" }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.4", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-usb = "0.4.0"
embassy-futures = "0.1.1"

static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }

proc-lut = { path = "proc-lut" }
byteorder = { version = "1.5", default-features = false }

fixed = "1.29"

usbd-hid = { version = "0.8.2", optional = true }

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git" }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"

[features]
default = [ "panic_probe" ]
lut_based_volume = []
hid_buttons = [ "hid" ]
hid_rotary = [ "hid" ]
hid = [ "dep:usbd-hid" ]
# Disabling `panic_probe` switches to reset on panic panic-handler
panic_probe = [ "dep:panic-probe" ]
