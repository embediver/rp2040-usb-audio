[workspace]
members = ["proc-lut"]

[package]
edition = "2024"
name = "rp2040-usb-audio"
version = "0.1.0"
authors = ["Marvin Gudel <github.marvin@gudel.org>"]
resolver = "2"

[[bin]]
name = "rp2040-usb-audio"
test = false
bench = false

[dependencies]
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"], optional = true }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-storage = "0.3.1"

cortex-m-rt = "0.7.3"
cortex-m = { version = "0.7.6" }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1.2"

static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }

proc-lut = { path = "proc-lut" }
byteorder = { version = "1.5", default-features = false }

fixed = "1.29"

usbd-hid = { version = "0.10", optional = true }
const-hex = { version = "1.17.0", default-features = false }

heapless = "0.9.4"

[patch.crates-io]
# embassy-executor = { git = "https://github.com/embassy-rs/embassy.git" }
# embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }
# embassy-time = { git = "https://github.com/embassy-rs/embassy.git" }
# embassy-rp = { git = "https://github.com/embassy-rs/embassy.git" }
# embassy-usb = { git = "https://github.com/embassy-rs/embassy.git" }
# embassy-futures = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-executor = { path = "../../other/embassy/embassy-executor" }
embassy-sync = { path = "../../other/embassy/embassy-sync" }
embassy-time = { path = "../../other/embassy/embassy-time" }
embassy-rp = { path = "../../other/embassy/embassy-rp" }
embassy-usb = { path = "../../other/embassy/embassy-usb" }
embassy-futures = { path = "../../other/embassy/embassy-futures" }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"

[features]
default = ["lut_based_volume", "power_control"]
lut_based_volume = []
hid_buttons = [ "hid" ]
hid_rotary = [ "hid" ]
hid = [ "dep:usbd-hid" ]
# Disabling `panic_probe` switches to reset on panic panic-handler
panic_probe = [ "dep:panic-probe" ]
power_control = []
